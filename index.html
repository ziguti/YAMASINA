<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>山科歴史アーカイブ | Yamashina Historical Archive</title>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- External JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

    <!-- Navigation Header -->
    <header class="main-header">
        <div class="header-container">
            <div class="brand">
                <h1 class="archive-title">山科歴史アーカイブ</h1>
                <span class="archive-subtitle">Yamashina Historical Archive</span>
            </div>
            <nav class="nav-modes">
                <button id="btn-map" class="nav-btn active" onclick="showPage('map')">
                    <i class="fa-solid fa-map-location-dot"></i> <span>マップ</span>
                </button>
                <button id="btn-db" class="nav-btn" onclick="showPage('db')">
                    <i class="fa-solid fa-camera-retro"></i> <span>古写真</span>
                </button>
                <button id="btn-map-db" class="nav-btn" onclick="showPage('map-db')">
                    <i class="fa-solid fa-book-atlas"></i> <span>古地図DB</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Sub Header for Map Controls -->
    <div id="map-ui" class="sub-header">
        <div class="control-group">
            <button id="m-btn-layers" class="sub-nav-btn active" onclick="switchControl('layers')">
                <i class="fa-solid fa-layer-group"></i> レイヤ選択
            </button>
            <button id="m-btn-slider" class="sub-nav-btn" onclick="switchControl('slider')">
                <i class="fa-solid fa-clock-rotate-left"></i> 時代スライダー
            </button>
        </div>
        
        <div id="slider-box" class="slider-container" style="display:none;">
            <input type="range" id="era-slider" min="0" max="5" step="1" value="0">
            <div id="era-label-container">
                <span id="era-label" class="era-display">現代空中写真</span>
            </div>
        </div>
    </div>

    <!-- Sub Header for DB Controls -->
    <div id="db-ui" class="sub-header" style="display:none;">
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="db-search" placeholder="資料名で検索..." oninput="filterDB()">
        </div>
        <div class="filter-container">
            <select id="era-filter" onchange="filterDB()">
                <option value="">全ての年代</option>
                <option value="明治">明治時代</option>
                <option value="大正">大正時代</option>
                <option value="昭和">昭和時代</option>
            </select>
        </div>
    </div>

    <!-- Main Content Pages -->
    <main class="content-wrapper">
        <!-- Map Page -->
        <section id="page-map" class="page active">
            <div id="map"></div>
            
            <div class="map-overlay-controls">
                <div class="opacity-control">
                    <span class="control-label" id="opacity-target">調整：未選択</span>
                    <input type="range" id="opacity-slider" min="0" max="1" step="0.05" value="1.0">
                </div>
            </div>
            
            <button class="location-btn" onclick="requestLocation()" title="現在地を表示">
                <i class="fa-solid fa-location-crosshairs"></i>
            </button>
        </section>

        <!-- Photo Database Page -->
        <section id="page-db" class="page">
            <div class="scroll-container">
                <div id="photo-list" class="photo-grid"></div>
            </div>
        </section>

        <!-- Map Database Page -->
        <section id="page-map-db" class="page">
            <div class="placeholder-content">
                <div class="coming-soon">
                    <i class="fa-solid fa-scroll"></i>
                    <h2>古地図データベース</h2>
                    <p>現在メタデータ構築中です。公開までしばらくお待ちください。</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Modals -->
    <!-- Photo Detail Modal -->
    <div id="detail-modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- 3D Model Modal -->
    <div id="3d-modal" class="modal-3d" style="display:none;">
        <button class="modal-close-light" onclick="close3DModal()">&times;</button>
        <div id="3d-modal-body" class="full-screen-3d"></div>
    </div>

    <!-- Full Screen Image Overlay -->
    <div id="full-screen-overlay" class="image-overlay" onclick="closeFullScreenImage()">
        <img src="" alt="全画面写真" id="full-screen-img">
    </div>

    <!-- Notification Toast -->
    <div id="notification-toast" class="toast"></div>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
